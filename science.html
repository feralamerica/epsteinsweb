<h1 style="margin: 6px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: .95; text-transform: uppercase">The science pipeline</h1>
<p style="margin: 14px 0 0; font-size: 17px; color: #e3e8f3; max-width: 760px">Epstein bought his way into science. He funded labs and salons, paid researchers through his foundation, hosted scientists at his homes and on his island, and steered other people's gifts to universities. These are the scientists and institutions the DOJ files document.</p>
<p style="margin: 10px 0 0; font-size: 14px; color: #aab7d1; max-width: 760px"><b style="color: #f4f6fb">Appearing here is not evidence of wrongdoing.</b> Each card says how the person is documented. Red marks someone named by an accuser; denials are on their cards.</p>
