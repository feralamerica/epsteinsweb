<meta property="og:site_name" content="Epstein's Web">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="https://epsteinsweb.com/assets/og-card.jpg">

<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#011032}
a{color:#9cc0ff}a:hover{color:#ffffff}
.lt a{color:#0b3d91}.lt a:hover{color:#c8102e}
.efta{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;text-decoration:none;white-space:nowrap}
.efta:hover{text-decoration:underline}
.topnav a{color:#c9d3e8;text-decoration:none;white-space:nowrap}.topnav a:hover{color:#ffffff}
.kp:hover{box-shadow:0 14px 34px rgba(1,16,50,.14) !important}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.mm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:48px;align-items:center}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:1360px){header .byfa{display:none}}
@media (max-width:1250px){header nav.topnav{gap:12px !important;font-size:13px !important}header .hbtns a{padding:0 10px !important;font-size:12.5px !important}header .hdr{gap:14px !important}}
@media (max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.mm{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:minmax(0,1fr)}.arrow{transform:rotate(90deg)}.topnav{display:none !important}}
</style>

<style>@media (max-width:700px){h1{font-size:40px !important;line-height:1 !important}h2{font-size:32px !important;line-height:1.05 !important}}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div id="top" style="font-family: Inter, 'Helvetica Neue', sans-serif; color: #f4f6fb; background: #011032; line-height: 1.6">

<header style="border-bottom: 1px solid #1f3f74; background: #010c26">
<div class="hdr" style="max-width: 1320px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
<a href="#top" style="text-decoration: none; color: #f4f6fb; display: flex; align-items: center; gap: 10px">
<img src="favicon-192.png" alt="" width="32" height="32" style="display: block; border-radius: 7px; flex: none">
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase">Epstein's Web</span>
<span class="byfa" style="font-size: 12px; color: #aab7d1">by Feral America</span>
</a>
<nav class="topnav" aria-label="Main" style="display: flex; gap: 16px; font-size: 14px; font-weight: 500; flex-wrap: wrap">
<a href="moneymap.html">Money Map</a>
<a href="emails.html">Correspondence</a>
<a href="flights.html">Flight logs</a>
<a href="book.html">Little Black Book</a>
<a href="records.html">Court and FBI records</a>
<a href="news.html">News</a>
</nav>
<div class="hbtns" style="margin-left: auto; display: flex; gap: 10px; flex: none; white-space: nowrap">
<a href="mailto:localtip@proton.me" title="Email localtip@proton.me" style="display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 9px; background: #c8102e; color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 2 10.5l7.5 3L12 21l3.5-6.2L22 2zM9.5 13.5 22 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Send a tip</a>
<a href="https://venmo.com/u/bustertoks" title="Support us on Venmo: @bustertoks" style="display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 9px; background: #1f9d55; color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: 700"><span aria-hidden="true" style="display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; color: #1f9d55; font-size: 12px; font-weight: 800">$</span>Support our work</a>
</div>
</div>
</header>

<!-- Logo -->
<section aria-label="Epstein's Web by Feral America" style="background: #ffffff; border-bottom: 1px solid #d7deeb">
<div style="max-width: 1180px; margin: 0 auto; padding: 34px 22px 28px; display: flex; justify-content: center">
<img src="assets/ew-logo.webp" alt="Epstein's Web by Feral America" width="1000" height="676" style="display: block; width: 100%; max-width: 640px; height: auto">
</div>
</section>

<!-- Hero -->
<section style="padding: 72px 0 64px">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px">
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .18em; text-transform: uppercase; color: #ff8a8a">A sourced map of the DOJ Epstein files</div>
<h1 style="margin: 14px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 60px; line-height: .95; text-transform: uppercase; max-width: 820px">The Epstein files, mapped. With receipts.</h1>
<p style="margin: 24px 0 0; font-size: 19px; line-height: 1.6; max-width: 720px; color: #e3e8f3">The Justice Department has released more than 3.5 million pages. We trace them two ways: the <b>money</b> (wires, trusts, shells, tax filings) and the <b>relationships</b> (emails, flight logs, contact books, court and FBI records, news reporting). Every claim links to the file it comes from.</p>
<form role="search" action="#" onSubmit="{{onHqGo}}" style="margin: 0"><label style="margin-top: 32px; display: flex; align-items: center; gap: 12px; max-width: 680px; background: #0f2650; border: 1px solid #3a5a92; border-radius: 12px; padding: 0 16px; min-height: 56px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aab7d1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Search the files</span>
<input type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" value="{{hq}}" onInput="{{onHq}}" onKeyDown="{{onHqKey}}" aria-label="Search the files" placeholder="Search a name, company, or EFTA number" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f6fb; font: 400 16px Inter, sans-serif; outline: none">
</label></form>
<sc-if value="{{hasHs}}" hint-placeholder-val="{{false}}">
<div role="listbox" style="max-width: 680px; margin-top: 6px; background: #0a1c3d; border: 1px solid #3a5a92; border-radius: 12px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.35)">
<sc-for list="{{hs}}" as="r" hint-placeholder-count="4"><a id="{{r.id}}" href="{{r.href}}" onClick="{{r.pick}}" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid #1f3f74; text-decoration: none; color: #f4f6fb"><span style="display: inline-flex; align-items: center; gap: 10px; min-width: 0"><span style="width: 10px; height: 10px; flex: none; border-radius: {{r.shape}}; background: {{r.color}}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.label}}</span></span><span style="flex: none; font-size: 12px; color: #9cc0ff">{{r.kind}}</span></a></sc-for>
</div>
</sc-if>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: #aab7d1; align-items: center">
<span>Try:</span>
<sc-for list="{{tries}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" onClick="{{t.pick}}" style="color: #c9d3e8; border: 1px solid #1f3f74; border-radius: 999px; padding: 4px 12px; text-decoration: none">{{t.label}}</a>
</sc-for>
</div>
<div class="g3" style="margin-top: 48px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="border-top: 3px solid {{s.bar}}; background: #0a1c3d; padding: 16px 18px; border-radius: 0 0 10px 10px">
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 42px; line-height: 1">{{s.n}}</div>
<div style="font-size: 13px; color: #c9d3e8; margin-top: 6px">{{s.l}}</div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- Ways in -->
<section style="padding: 0 0 72px">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px">
<h2 style="margin: 0 0 6px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 30px; text-transform: uppercase">Six ways into the files</h2>
<p style="margin: 0 0 22px; color: #aab7d1">Each collection is a filter on the network map and in search.</p>
<div class="g3">
<sc-for list="{{lenses}}" as="l" hint-placeholder-count="6">
<a href="{{l.href}}" style="display: flex; flex-direction: column; gap: 6px; background: #0f2650; border: 1px solid #1f3f74; border-radius: 14px; padding: 20px 22px; text-decoration: none; color: #f4f6fb">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: {{l.color}}">{{l.kind}}</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; line-height: 1.1">{{l.name}}</span>
<span style="font-size: 14px; color: #c9d3e8">{{l.desc}}</span>
<span style="font-size: 13px; font-weight: 600; color: #9cc0ff; margin-top: 4px">{{l.cta}} →</span>
</a>
</sc-for>
</div>
</div>
</section>

<!-- Key players (light) -->
<section id="players" class="lt" style="background: #f4f6fb; color: #0a1730; padding: 76px 0">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 52px; text-transform: uppercase; line-height: 1">Key players</h2>
<p style="margin: 8px 0 0; color: #43506b; max-width: 680px">The six people with the most at stake in the files. Each card says what the record shows and what is only alleged. Everyone here denies wrongdoing.</p>
</div>
<a href="network.html" style="font-weight: 600; font-size: 14px">Full directory →</a>
</div>
<div style="display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: #43506b; margin: 22px 0 26px">
<span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #ff5c5c"></span>Red: named by an accuser, charged or convicted. Accused, never "guilty."</span>
<span style="display: inline-flex; align-items: center; gap: 7px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #6ea8fe"></span>Blue: documented ties, no accusation in the record</span>
</div>
<div class="g3">
<sc-for list="{{players}}" as="p" hint-placeholder-count="6">
<article class="kp" style="background: #ffffff; border: 1px solid #d7deeb; border-top: 4px solid {{p.color}}; border-radius: 14px; padding: 22px 22px 18px; box-shadow: 0 8px 24px rgba(1,16,50,.06); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px; align-items: center">
<span style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: {{p.color}}; color: #0a1730; display: flex; align-items: center; justify-content: center; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 22px">{{p.init}}</span>
<div style="min-width: 0">
<h3 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.05; text-transform: uppercase">{{p.name}}</h3>
<div style="font-size: 13px; color: #43506b">{{p.role}}</div>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{p.tags}}" as="t" hint-placeholder-count="3">
<span style="{{t.style}}">{{t.label}}</span>
</sc-for>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px">
<sc-for list="{{p.points}}" as="pt" hint-placeholder-count="3">
<li style="font-size: 14px; color: #1c2742; padding-left: 14px; position: relative"><span style="position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: #8a94aa"></span>{{pt.t}} <a class="efta" href="{{pt.href}}">{{pt.id}}</a></li>
</sc-for>
</ul>
<div style="font-size: 13px; color: #43506b; background: #f4f6fb; border-radius: 8px; padding: 8px 10px"><b style="color: #0a1730">Response:</b> {{p.denial}}</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; font-size: 13.5px; font-weight: 600">
<a href="players.html" onClick="{{p.open}}">Open profile →</a>
<span style="font-weight: 500; color: #43506b; font-size: 12.5px">{{p.files}}</span>
</div>
</article>
</sc-for>
</div>
</div>
</section>

<!-- Money map (dark) -->
<section id="money" style="padding: 80px 0">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px" class="mm">
<div>
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #ffd166">Investigation</div>
<h2 style="margin: 8px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 56px; text-transform: uppercase; line-height: .95">The Epstein Money Map</h2>
<p style="margin: 18px 0 0; font-size: 17px; color: #e3e8f3">Who paid Epstein, which shells the money passed through, and where it went. 33 boxes, each one cited to the DOJ files, with leads still to be worked.</p>
<div class="g2" style="margin-top: 24px; gap: 12px">
<sc-for list="{{mmStats}}" as="s" hint-placeholder-count="4">
<div style="background: #0a1c3d; border: 1px solid #1f3f74; border-radius: 10px; padding: 12px 14px">
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{s.n}}</div>
<div style="font-size: 12.5px; color: #c9d3e8; margin-top: 4px">{{s.l}}</div>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px">
<a href="moneymap.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 10px; background: {{accent}}; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px">Open the Money Map</a>
<a href="enhanced-education.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid #3a5a92; color: #f4f6fb; text-decoration: none; font-weight: 500; font-size: 14px">Start with Enhanced Education</a>
</div>
</div>
<div style="background: #08193a; border: 1px solid #1f3f74; border-radius: 16px; padding: 22px">
<div class="flow">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #aab7d1">Money in</div>
<sc-for list="{{flowIn}}" as="f" hint-placeholder-count="3">
<a href="{{f.href}}" onClick="{{f.pick}}" style="display: block; text-decoration: none; color: #f4f6fb; background: #0f2650; border: 1px solid #1f3f74; border-left: 4px solid {{f.color}}; border-radius: 8px; padding: 8px 10px"><div style="font-weight: 600; font-size: 14px">{{f.name}}</div><div style="font-size: 12px; color: #ffd166">{{f.amt}}</div><div style="font-size: 11.5px; color: #9cc0ff; margin-top: 3px">{{f.cta}}</div></a>
</sc-for>
</div>
<div class="arrow" style="text-align: center; color: #7f8db0; font-size: 22px" aria-hidden="true">→</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #aab7d1">Epstein's entities</div>
<sc-for list="{{flowMid}}" as="f" hint-placeholder-count="4">
<a href="{{f.href}}" onClick="{{f.pick}}" style="display: block; text-decoration: none; color: #f4f6fb; background: #0f2650; border: 1px solid #1f3f74; border-left: 4px solid {{f.color}}; border-radius: 8px; padding: 8px 10px"><div style="font-weight: 600; font-size: 14px">{{f.name}}</div><div style="font-size: 12px; color: #c9d3e8">{{f.amt}}</div><div style="font-size: 11.5px; color: #9cc0ff; margin-top: 3px">{{f.cta}}</div></a>
</sc-for>
</div>
<div class="arrow" style="text-align: center; color: #7f8db0; font-size: 22px" aria-hidden="true">→</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #aab7d1">Money out</div>
<sc-for list="{{flowOut}}" as="f" hint-placeholder-count="3">
<a href="{{f.href}}" onClick="{{f.pick}}" style="display: block; text-decoration: none; color: #f4f6fb; background: #0f2650; border: 1px solid #1f3f74; border-left: 4px solid {{f.color}}; border-radius: 8px; padding: 8px 10px"><div style="font-weight: 600; font-size: 14px">{{f.name}}</div><div style="font-size: 12px; color: #c9d3e8">{{f.amt}}</div><div style="font-size: 11.5px; color: #9cc0ff; margin-top: 3px">{{f.cta}}</div></a>
</sc-for>
</div>
</div>
<p style="margin: 16px 0 0; font-size: 12.5px; color: #aab7d1">A simplified view. The full map has every flow, with the DOJ file behind each one.</p>
</div>
</div>
</section>

<!-- Network (light) -->
<section id="network" class="lt" style="background: #f4f6fb; color: #0a1730; padding: 76px 0">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px">
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 52px; text-transform: uppercase; line-height: 1">Explore the network</h2>
<p style="margin: 8px 0 28px; color: #43506b; max-width: 700px">Every documented person, bank, organization, university and trust, linked to the collections they appear in. Click anyone to open their profile.</p>
<div class="g4">
<sc-for list="{{views}}" as="v" hint-placeholder-count="4">
<a href="{{v.href}}" style="display: flex; flex-direction: column; gap: 6px; background: #ffffff; border: 1px solid #d7deeb; border-radius: 14px; padding: 20px; text-decoration: none; color: #0a1730; min-height: 44px">
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase">{{v.name}}</span>
<span style="font-size: 14px; color: #43506b">{{v.desc}}</span>
<span style="font-size: 13px; font-weight: 600; color: #0b3d91; margin-top: auto; padding-top: 4px">{{v.cta}} →</span>
</a>
</sc-for>
</div>
<div class="g2" style="margin-top: 26px">
<div style="background: #ffffff; border: 1px solid #d7deeb; border-radius: 14px; padding: 22px">
<h3 style="margin: 0 0 14px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase">Reading the colors</h3>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="8">
<div style="display: flex; gap: 10px; align-items: center; font-size: 14px"><span style="flex: none; width: 14px; height: 14px; border-radius: {{c.radius}}; background: {{c.color}}; box-shadow: inset 0 0 0 1px rgba(10,23,48,.25)"></span><span><b>{{c.name}}</b> <span style="color: #43506b">{{c.note}}</span></span></div>
</sc-for>
</div>
<p style="margin: 14px 0 0; font-size: 13px; color: #43506b">The same colors are used on every map, profile and table on this site.</p>
</div>
<div style="background: #ffffff; border: 1px solid #d7deeb; border-radius: 14px; padding: 22px">
<h3 style="margin: 0 0 14px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase">Guided threads</h3>
<sc-for list="{{threads}}" as="t" hint-placeholder-count="4">
<a href="network.html" style="display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #e3e8f1; text-decoration: none; color: #0a1730; min-height: 44px">
<span><b style="display: block; font-size: 15px">{{t.name}}</b><span style="font-size: 13px; color: #43506b">{{t.desc}}</span></span>
<span aria-hidden="true" style="color: #43506b">→</span>
</a>
</sc-for>
</div>
</div>
</div>
</section>

<!-- Documents (dark) -->
<section id="documents" style="padding: 76px 0">
<div style="max-width: 1180px; margin: 0 auto; padding: 0 22px">
