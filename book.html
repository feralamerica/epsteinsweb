<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Black Book · Epstein's Web</title>
<meta name="description" content="Every person and entity in the Epstein files, with a card for each: DOJ hit counts, key files, every linked document and reporting.">
<meta property="og:title" content="Little Black Book · Epstein's Web">
<meta property="og:description" content="Every person and entity in the Epstein files, with a card for each: DOJ hit counts, key files, every linked document and reporting.">
<meta property="og:site_name" content="Epstein's Web">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23011032%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23ff5c5c%22 font-family=%22Arial%22 font-weight=%22700%22%3EEW%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Special+Elite&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#011032}
a{color:#9cc0ff}a:hover{color:#ffffff}
.topnav a{color:#c9d3e8;text-decoration:none;white-space:nowrap}.topnav a:hover{color:#ffffff}
.entry{all:unset;box-sizing:border-box;cursor:pointer;text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;height:34px;padding:0 4px;font-family:"Special Elite","Courier New",monospace;font-size:16.5px;border-radius:3px}
.entry:hover{background:rgba(0,0,0,.06)}
.entry:focus-visible{outline:2px solid #0b3d91}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;width:30px;height:23px;font-family:"Special Elite",monospace;font-size:13px;border-radius:0 5px 5px 0}
.tab:focus-visible{outline:2px solid #ffd166}
.turn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #3a5a92;color:#f4f6fb;font:600 14px Inter,sans-serif}
.turn:hover{background:#0f2650}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;font:500 13px Inter,sans-serif}
.efta{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;text-decoration:none;white-space:nowrap;color:#0b3d91}
.efta:hover{text-decoration:underline}
.card a{color:#0b3d91}.card a:hover{color:#c8102e}
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.bookwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.rolo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center}
@media (max-width:1180px){.bookwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.spread{grid-template-columns:minmax(0,1fr)}.rolo{grid-template-columns:minmax(0,1fr)}.topnav{display:none !important}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: Inter, 'Helvetica Neue', sans-serif; color: #f4f6fb; background: #011032; line-height: 1.55; min-height: 100vh">

<header style="border-bottom: 1px solid #1f3f74; background: #010c26">
<div style="max-width: 1280px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap">
<a href="index.html" style="text-decoration: none; color: #f4f6fb"><span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase">Epstein's Web</span></a>
<nav class="topnav" aria-label="Main" style="display: flex; gap: 20px; font-size: 14px; font-weight: 500; flex-wrap: wrap">
<a href="index.html#money">Money</a>
<a href="emails.html">Correspondence</a>
<a href="flights.html">Flight logs</a>
<a href="book.html" aria-current="page" style="color: #ffffff; box-shadow: inset 0 -2px 0 #c8102e">Little Black Book</a>
<a href="records.html">Court and FBI records</a>
<a href="news.html">News</a>
</nav>
</div>
</header>

<!-- Rolodex feature -->
<section id="rolodex" style="padding: 44px 0 40px; scroll-margin-top: 8px">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 22px" class="rolo">
<div>
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #9cc0ff">Social · Everyone in the files</div>
<h1 style="margin: 6px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: .95; text-transform: uppercase">The Little Black Book</h1>
<p style="margin: 14px 0 0; font-size: 17px; color: #e3e8f3; max-width: 580px">Every person and entity on Epstein's Web, with a card for each: how they're documented, how often they appear in the DOJ library, the files that matter, and everywhere they show up on this site.</p>
<p style="margin: 10px 0 0; font-size: 14px; color: #aab7d1; max-width: 580px">Typed entries were in Epstein's own address book. Entries in blue ink were added by us from the other collections. Being listed is not evidence of wrongdoing, and we never publish phone numbers or addresses.</p>
<a href="network.html" style="display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 600">See everyone on the network map →</a>
</div>
<div>
<div style="position: relative; padding-top: 14px">
<div style="position: absolute; left: 22px; right: 22px; top: 0; height: 30px; background: #d9d4c4; border-radius: 10px 10px 0 0; opacity: .5"></div>
<div style="position: absolute; left: 11px; right: 11px; top: 7px; height: 30px; background: #e6e1d2; border-radius: 10px 10px 0 0; opacity: .8"></div>
<article aria-live="polite" style="position: relative; background: #fbf8ef; color: #1b1b1b; border-radius: 12px; padding: 30px 28px 22px; box-shadow: 0 18px 40px rgba(0,0,0,.45); min-height: 250px; display: flex; flex-direction: column; gap: 10px; border-top: 6px solid {{rolo.color}}">
<div style="position: absolute; top: 10px; left: 50%; display: flex; gap: 70px; transform: translateX(-50%)"><span style="width: 14px; height: 14px; border-radius: 50%; background: #011032"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #011032"></span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px">
<h2 style="margin: 0; font-family: 'Special Elite', monospace; font-weight: 400; font-size: 28px; line-height: 1.1">{{rolo.d}}</h2>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b6b6b; white-space: nowrap">{{rolo.pos}}</span>
</div>
<div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #43506b"><span style="width: 10px; height: 10px; border-radius: {{rolo.shape}}; background: {{rolo.color}}"></span>{{rolo.nat}}</div>
<p style="margin: 0; font-size: 14.5px; color: #2b2b2b">{{rolo.ctx}}</p>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto">
<span style="font-size: 13px; color: #43506b"><b style="color: #1b1b1b">{{rolo.dojN}}</b> DOJ library hits · {{rolo.nFiles}}</span>
<a href="#card" onClick="{{rolo.open}}" style="font-size: 13.5px; font-weight: 600; color: #0b3d91">Open the full card ↓</a>
</div>
</article>
</div>
<div style="display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap">
<button type="button" class="turn" onClick="{{roloPrev}}" aria-label="Previous card">◀ Back</button>
<button type="button" class="turn" onClick="{{roloSpin}}" style="background: #c8102e; border-color: #c8102e">Spin the Rolodex</button>
<button type="button" class="turn" onClick="{{roloNext}}" aria-label="Next card">Next ▶</button>
</div>
</div>
</div>
</section>

<!-- The book -->
<section id="book" style="scroll-margin-top: 8px; background: #08193a; border-top: 1px solid #1f3f74; padding: 40px 0 64px">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 22px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px">
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 34px; text-transform: uppercase">Open the book</h2>
<label style="display: flex; align-items: center; gap: 10px; background: #0f2650; border: 1px solid #3a5a92; border-radius: 10px; padding: 0 12px; min-height: 44px; flex: 0 1 340px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aab7d1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Find a name in the book</span>
<input type="search" value="{{q}}" onInput="{{onFind}}" placeholder="Find a name, jump to its page" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f6fb; font: 400 14px Inter, sans-serif; outline: none">
</label>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button type="button" class="chip" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}} <span style="opacity: .7">{{f.n}}</span></button>
</sc-for>
</div>

<div class="bookwrap">
<div>
<div style="background: #121212; border-radius: 16px; padding: 18px 0 18px 18px; box-shadow: 0 24px 50px rgba(0,0,0,.55), inset 0 0 0 1px #2a2a2a; display: flex">
<div style="flex: 1; min-width: 0; border: 1px dashed #3d3d3d; border-radius: 10px; padding: 8px 0 8px 8px; display: flex">
<div class="spread" style="flex: 1; min-width: 0; background: #f6f1e4; border-radius: 6px 0 0 6px; box-shadow: inset -8px 0 18px -10px rgba(0,0,0,.35)">
<sc-for list="{{pages}}" as="pg" hint-placeholder-count="2">
<div style="{{pg.style}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #b33a3a; padding-bottom: 4px; margin-bottom: 6px">
<span style="font-family: 'Special Elite', monospace; font-size: 46px; line-height: 1; color: #1b1b1b">{{pg.letter}}</span>
<span style="font-family: 'Special Elite', monospace; font-size: 12px; color: #8a8270">{{pg.sub}}</span>
</div>
<div style="background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 33px, #c9d6e8 33px, #c9d6e8 34px); min-height: 476px">
<sc-for list="{{pg.entries}}" as="e" hint-placeholder-count="10">
<a class="entry" href="#rolodex" onClick="{{e.pick}}" style="{{e.style}}">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{e.d}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; flex: none"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8a8270">{{e.fileMark}}</span><span style="width: 9px; height: 9px; border-radius: {{e.shape}}; background: {{e.color}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25)"></span></span>
</a>
</sc-for>
</div>
<div style="margin-top: 10px; display: flex; flex-direction: {{pg.navDir}}; justify-content: space-between; align-items: center; gap: 10px; font-family: 'Special Elite', monospace; font-size: 12px; color: #8a8270"><sc-if value="{{pg.canTurn}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{pg.navPick}}" style="all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px dashed #b9ab8c; background: rgba(255,255,255,.55); font-family: 'Special Elite', monospace; font-size: 14px; color: #8f2a2a">{{pg.navLabel}}</button></sc-if><span>{{pg.num}}</span></div>
</div>
</sc-for>
</div>
<div role="tablist" aria-label="Jump to a letter" style="display: flex; flex-direction: column; gap: 1px; padding-top: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="26">
<button type="button" class="tab" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.l}}</button>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap">
<span style="font-size: 13px; color: #aab7d1; margin: 0 auto">{{spreadLabel}}</span>
</div>
<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 12.5px; color: #aab7d1">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="6">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: {{l.shape}}; background: {{l.color}}"></span>{{l.name}}</span>
</sc-for>
<span>§ = key files reviewed</span>
</div>
</div>

<!-- The card -->
<aside id="card" class="card" aria-live="polite" style="scroll-margin-top: 12px; background: #fbf8ef; color: #1b1b1b; border-radius: 14px; padding: 22px 22px 20px; box-shadow: 0 14px 34px rgba(0,0,0,.4); border-top: 6px solid {{c.color}}; display: flex; flex-direction: column; gap: 16px">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b">{{c.typeLabel}}</div>
<h3 style="margin: 4px 0 6px; font-family: 'Special Elite', monospace; font-weight: 400; font-size: 27px; line-height: 1.15">{{c.f}}</h3>
<div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #43506b"><span style="flex: none; width: 10px; height: 10px; border-radius: {{c.shape}}; background: {{c.color}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25)"></span>{{c.nat}}</div>
</div>
<div style="{{c.bookStyle}}">{{c.bookNote}}</div>
<p style="margin: 0; font-size: 14.5px; color: #2b2b2b">{{c.ctx}}</p>

<sc-if value="{{c.hasSub}}" hint-placeholder-val="{{false}}">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #c8102e; margin-bottom: 8px">Our reporting</div>
<sc-for list="{{c.subL}}" as="n" hint-placeholder-count="1"><a href="{{n.href}}" target="_blank" rel="noopener" style="display: block; background: #ffffff; border: 1px solid #e0d8c6; border-radius: 12px; overflow: hidden; text-decoration: none; color: #1b1b1b; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 10px"><img src="{{n.img}}" alt="" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #e9e3d4"><span style="display: block; padding: 12px 14px 14px"><span style="display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #c8102e"><span aria-hidden="true" style="display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: #c8102e; color: #ffffff; font-size: 11px">FA</span>Feral America · Substack</span><span style="display: block; margin-top: 6px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.15">{{n.label}}</span><sc-if value="{{n.hasSubt}}" hint-placeholder-val="{{true}}"><span style="display: block; margin-top: 4px; font-size: 13.5px; color: #43506b; line-height: 1.4">{{n.subt}}</span></sc-if><span style="display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 12.5px; color: #6b6b6b"><span>{{n.date}}</span><span style="font-weight: 700; color: #c8102e">Read on Substack ↗</span></span></span></a></sc-for>
</div>
</sc-if>

<div style="background: #f1ebdb; border-radius: 10px; padding: 12px 14px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">{{c.dojN}}</span>
<span style="font-size: 13px; color: #43506b">hits in the DOJ Epstein Library for "{{c.dojQ}}"</span>
</div>
<div style="font-size: 12px; color: #6b6b6b; margin-top: 4px">Search hits, not a count of mentions. Common names can overcount. <a href="https://www.justice.gov/epstein">Search the library</a></div>
</div>

<sc-if value="{{c.hasFiles}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px">Key files ({{c.nFiles}})</div>
<sc-for list="{{c.filesShown}}" as="f" hint-placeholder-count="4">
<div style="padding: 8px 0; border-top: 1px solid #e3dccb">
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><a class="efta" href="{{f.href}}">{{f.id}}</a><span style="{{f.badge}}">{{f.label}}</span></div>
<div style="font-size: 13.5px; color: #2b2b2b; margin-top: 2px">{{f.gist}}</div>
</div>
</sc-for>
<sc-if value="{{c.more}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleAll}}" style="margin-top: 6px; border: 1px solid #d9cfb8; background: #ffffff; border-radius: 8px; min-height: 36px; padding: 0 12px; font: 600 13px Inter, sans-serif; color: #0b3d91; cursor: pointer">{{c.moreLabel}}</button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{c.hasHits}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px">Top search hits</div>
<sc-for list="{{c.hitsL}}" as="h" hint-placeholder-count="5">
<div style="padding: 8px 0; border-top: 1px solid #e3dccb">
<div style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap"><a class="efta" href="{{h.href}}">{{h.id}}</a><span style="font-size: 11.5px; color: #6b6b6b">{{h.meta}}</span></div>
<div style="font-size: 13.5px; color: #2b2b2b; margin-top: 2px">{{h.sum}}</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{c.hasAx}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 4px">Every linked DOJ file ({{c.axTotal}})</div>
<div style="font-size: 12px; color: #6b6b6b; margin-bottom: 8px">Library search results where the name appears in the matched text. Not yet reviewed: these are leads, not findings.</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px"><sc-for list="{{c.axChips}}" as="k" hint-placeholder-count="3"><button type="button" aria-pressed="{{k.on}}" onClick="{{k.pick}}" style="{{k.style}}; min-height: 32px; padding: 0 11px; border-radius: 999px; font: 600 12px Inter, sans-serif; cursor: pointer">{{k.label}}</button></sc-for></div>
<div style="max-height: 420px; overflow-y: auto; border-top: 1px solid #e3dccb">
<sc-for list="{{c.axShown}}" as="f" hint-placeholder-count="6"><div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid #ece4d1"><a class="efta" href="{{f.href}}">{{f.id}}</a><span style="{{f.kindStyle}}">{{f.kind}}</span><span style="font-size: 12px; color: #6b6b6b">{{f.date}}</span></div></sc-for>
</div>
<sc-if value="{{c.axMore}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{c.axMorePick}}" style="margin-top: 8px; border: 1px solid #d9cfb8; background: #ffffff; border-radius: 8px; min-height: 36px; padding: 0 12px; font: 600 13px Inter, sans-serif; color: #0b3d91; cursor: pointer">{{c.axMoreLabel}}</button></sc-if>
<sc-if value="{{c.axCap}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: #6b6b6b; margin-top: 6px">Showing the first 200 matching files. <a href="{{c.axSearch}}">Search the library</a> for the rest.</div></sc-if>
</div>
</sc-if>

<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px">Across Epstein's Web</div>
<sc-for list="{{c.refs}}" as="r" hint-placeholder-count="2">
<a href="{{r.href}}" onClick="{{r.pick}}" style="display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #e3dccb; font-size: 14px; font-weight: 600; text-decoration: none">{{r.label}} <span aria-hidden="true">→</span></a>
</sc-for>
</div>

<sc-if value="{{c.hasNews}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px">Reporting</div>
<sc-for list="{{c.newsL}}" as="n" hint-placeholder-count="1"><a href="{{n.href}}" style="display: block; font-size: 13.5px; padding: 3px 0">{{n.label}}</a></sc-for>
</div>
</sc-if>

<div>
