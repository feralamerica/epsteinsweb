<style>
body{margin:0;background:#011032}
a{color:#9cc0ff}a:hover{color:#ffffff}
.lt a{color:#0b3d91}.lt a:hover{color:#c8102e}

.top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}

<style>
.navtog{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.hamb{display:none}
@media (max-width:760px){
header .hamb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin-left:auto;width:46px;height:46px;flex:none;border:1px solid #3a5a92;border-radius:10px;cursor:pointer;background:#0f2650}
header .hamb span{display:block;width:20px;height:2px;border-radius:2px;background:#f4f6fb;transition:transform .2s,opacity .2s}
.navtog:checked + .hamb span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.navtog:checked + .hamb span:nth-child(2){opacity:0}
.navtog:checked + .hamb span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.navtog:focus-visible + .hamb{outline:2px solid #ff8a8a;outline-offset:2px}
header nav.topnav{display:none !important;order:10;flex-basis:100%;flex-direction:column;gap:0 !important;font-size:16px !important;border-top:1px solid #1f3f74;margin-top:4px}
header nav.topnav a{padding:13px 2px;border-bottom:1px solid #13284f;box-shadow:none !important}
.navtog:checked ~ nav.topnav{display:flex !important}
header .hbtns{display:none !important;order:11;flex-basis:100%;margin:12px 0 4px !important;gap:10px}
.navtog:checked ~ .hbtns{display:flex !important}
header .hbtns a{flex:1 1 0;justify-content:center;min-height:46px !important}
header .byfa{display:none}
}
</style>
<header style="border-bottom: 1px solid #1f3f74; background: #010c26">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap">
<a href="index.html" style="text-decoration: none; color: #f4f6fb"><span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase">Epstein's Web</span></a>
<input type="checkbox" id="navtog" class="navtog" aria-label="Open menu">
<label for="navtog" class="hamb" title="Menu"><span></span><span></span><span></span></label>
<nav class="topnav" aria-label="Main" style="display: flex; gap: 20px; font-size: 14px; font-weight: 500; flex-wrap: wrap">

<a href="flights.html">Flight logs</a>

<a href="news.html" aria-current="page" style="color: #ffffff; box-shadow: inset 0 -2px 0 #c8102e">News</a>
</nav>
</div>
</header>

<!-- Title + live feed -->
<section style="padding: 44px 0 56px">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px" class="top">
<div>
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #ffd166">Context · News reporting</div>
<h1 style="margin: 6px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: .95; text-transform: uppercase">The coverage</h1>
<p style="margin: 14px 0 0; font-size: 17px; color: #e3e8f3; max-width: 600px">The stories that first exposed Epstein, the fight over the files, and today's headlines. Reporting explains what the documents show; the documents are the proof.</p>

<div style="margin-top: 30px; background: #0f2650; border: 1px solid #1f3f74; border-radius: 16px; padding: 22px 24px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px">
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #4dd0a7; box-shadow: 0 0 0 4px rgba(77,208,167,.2)"></span>Latest headlines</h2>
<span style="font-size: 12.5px; color: #aab7d1">Updated hourly · {{updated}}</span>
</div>
<ol class="feed" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{feed}}" as="f" hint-placeholder-count="5">
<li style="padding: 14px 0; border-top: 1px solid #1f3f74; display: flex; gap: 14px; align-items: baseline">
<span style="flex: none; width: 54px; font-size: 12px; color: #aab7d1; font-variant-numeric: tabular-nums">{{f.date}}</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<a class="h" href="{{f.url}}" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 1.3">{{f.title}}</a>
<span style="font-size: 12.5px; color: #aab7d1">{{f.source}}</span>
</span>
</li>
</sc-for>
</ol>
<a href="#archive" style="display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 600">More coverage →</a>
</div>
</div>

<!-- Bookmobile -->
<aside style="background: #fbf8ef; color: #1b1b1b; border-radius: 16px; padding: 26px 26px 24px; box-shadow: 0 18px 40px rgba(0,0,0,.4); border-top: 6px solid #c8102e">
<div style="font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8f0b20">On tour now</div>
<h2 style="margin: 6px 0 10px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase">The Redacted Reading Room</h2>
<p style="margin: 0 0 12px; font-size: 15px; color: #2b2b2b">The Donald J. Trump and Jeffrey Epstein Memorial Bookmobile is taking all 3.5 million released pages on the road, so anyone can read the files in person.</p>
<div style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px">Fall 2026 stops</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="5"><span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #ece6d6; color: #3a3a3a">{{s}}</span></sc-for>
</div>
<a href="https://trumpepsteinbookmobile.com/" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #c8102e; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px">Find a stop near you</a>
<div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid #e3dccb; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<a href="https://www.justice.gov/epstein" style="color: #0b3d91; font-weight: 600">DOJ Epstein Library →</a>
<a href="https://oversightdemocrats.house.gov/" style="color: #0b3d91; font-weight: 600">House Oversight releases →</a>
</div>
</aside>
</div>
</section>

<!-- From the day -->
<section id="archive" class="lt" style="background: #f4f6fb; color: #0a1730; padding: 72px 0">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 52px; text-transform: uppercase; line-height: 1">From the day</h2>
<p style="margin: 8px 0 30px; color: #43506b; max-width: 680px">The reporting that saw Epstein first, years before the files were released.</p>
<div class="g3">
<sc-for list="{{classics}}" as="c" hint-placeholder-count="3">
<article style="background: #ffffff; border: 1px solid #d7deeb; border-radius: 14px; padding: 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(1,16,50,.06)">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; color: #c8102e">{{c.year}}</span>
<span style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #43506b">{{c.outlet}}</span>
</div>
<h3 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.2">{{c.title}}</h3>
<div style="font-size: 13.5px; color: #43506b">{{c.byline}}</div>
<p style="margin: 0; font-size: 14.5px; color: #2b3754">{{c.why}}</p>
<a href="{{c.url}}" style="margin-top: auto; padding-top: 6px; font-weight: 600; font-size: 14px">Read at {{c.outlet}} →</a>
</article>
</sc-for>
</div>
</div>
</section>

<!-- The fight over the files -->
<section style="padding: 72px 0">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">
<h2 style="margin: 0 0 30px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 52px; text-transform: uppercase; line-height: 1">The fight over the files</h2>
<ol style="list-style: none; margin: 0; padding: 0; border-left: 2px solid #1f3f74; max-width: 860px">
<sc-for list="{{fight}}" as="t" hint-placeholder-count="6">
<li style="position: relative; padding: 0 0 26px 30px">
<span style="position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: {{t.dot}}; border: 2px solid #011032"></span>
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .06em; color: #aab7d1; text-transform: uppercase">{{t.when}}</div>
<div style="font-size: 15.5px; margin-top: 2px">{{t.what}}</div>
</li>
</sc-for>
</ol>
</div>
</section>

<footer style="border-top: 1px solid #1f3f74; background: #010c26; padding: 30px 0 40px; font-size: 13px; color: #aab7d1">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">Headlines link to the original outlets. Epstein's Web is an investigation by <a href="https://stayferalamerica.com" style="color: #c9d3e8">Feral America</a>.</div>
<div style="max-width: 1240px; margin: 8px auto 0; padding: 0 22px; margin-top: 14px"><div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><a href="mailto:localtip@proton.me" title="Email localtip@proton.me" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; background: #c8102e; color: #ffffff; font-weight: 700; font-size: 14px; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 2 10.5l7.5 3L12 21l3.5-6.2L22 2zM9.5 13.5 22 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Send a tip</a><a href="https://venmo.com/u/bustertoks" title="Venmo @bustertoks" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; background: #1f9d55; color: #ffffff; font-weight: 700; font-size: 14px; text-decoration: none"><span aria-hidden="true" style="display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; color: #1f9d55; font-size: 13px; font-weight: 800">$</span>Support our work <span style="font-weight: 500; opacity: .85">@bustertoks</span></a></div></div>

</footer>
</div>
</template>

</body>
