<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: Inter, 'Helvetica Neue', sans-serif; color: #f4f6fb; background: #011032; line-height: 1.55; min-height: 100vh">

<header style="border-bottom: 1px solid #1f3f74; background: #010c26">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap">
<a href="index.html" style="text-decoration: none; color: #f4f6fb"><span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase">Epstein's Web</span></a>

<section style="padding: 44px 0 34px">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #c39bff">Travel · Flight logs</div>
<h1 style="margin: 6px 0 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: .95; text-transform: uppercase">Who flew</h1>
<p style="margin: 14px 0 0; font-size: 17px; color: #e3e8f3; max-width: 760px">A ticket for every named passenger, built from two flight records in the DOJ files: the chart filed in the 2015 defamation case against Maxwell (her flights, 1998 to 2002) and pilot David Rodgers’ handwritten logbook, entered as Government Exhibit 662-RR at Maxwell’s trial (1991 to 2006), which we transcribed page by page.</p>
<p style="margin: 10px 0 0; font-size: 14px; color: #aab7d1; max-width: 760px">Flying on the plane is not evidence of wrongdoing. Counts include only flights where the person’s full name is written; initials are not counted. Handwriting is hard to read in places, so open the linked page to check any entry. Survivors and anyone redacted are left out.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 26px; max-width: 900px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="border-top: 3px solid {{s.bar}}; background: #0a1c3d; padding: 14px 16px; border-radius: 0 0 10px 10px">
<div style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">{{s.n}}</div>
<div style="font-size: 12.5px; color: #c9d3e8; margin-top: 4px">{{s.l}}</div>
</div>
</sc-for>
</div>
</div>
</section>

<section id="tickets" style="background: #08193a; border-top: 1px solid #1f3f74; padding: 40px 0 64px">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px">
<h2 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 34px; text-transform: uppercase">Passenger tickets</h2>
<label style="display: flex; align-items: center; gap: 10px; background: #0f2650; border: 1px solid #3a5a92; border-radius: 10px; padding: 0 12px; min-height: 44px; flex: 0 1 320px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aab7d1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Find a passenger</span>
<input type="search" value="{{q}}" onInput="{{onFind}}" placeholder="Find a passenger" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f6fb; font: 400 14px Inter, sans-serif; outline: none">
</label>
</div>

<div class="wrap2">
<div class="tgrid">
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="9">
<button type="button" class="ticket" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.ring}}">
<span style="padding: 14px 14px 12px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 6px solid {{t.color}}; border-radius: 12px 0 0 12px; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; color: #6b6b6b"><span>PASSENGER</span><span>{{t.ac}}</span></span>
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.05; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #43506b">{{t.span}}</span>
<span style="font-size: 12.5px; color: #2b2b2b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.route}}</span>
</span>
<span style="border-left: 2px dashed #cfc6b0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px">
<span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 38px; line-height: 1">{{t.n}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .1em; color: #6b6b6b">{{t.unit}}</span>
</span>
</button>
</sc-for>
</div>

<aside id="ticket" aria-live="polite" style="scroll-margin-top: 12px; background: #fbf8ef; color: #1b1b1b; border-radius: 14px; padding: 22px; box-shadow: 0 14px 34px rgba(0,0,0,.4); border-top: 6px solid {{d.color}}">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #6b6b6b">BOARDING RECORD</div>
<h3 style="margin: 4px 0 2px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05; text-transform: uppercase">{{d.name}}</h3>
<div style="font-size: 13px; color: #43506b">{{d.nat}}</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0">
<div style="background: #f1ebdb; border-radius: 8px; padding: 8px 12px"><b style="font-family: 'Saira Condensed', sans-serif; font-size: 26px">{{d.n}}</b> <span style="font-size: 12.5px; color: #43506b">{{d.unit}} in this chart</span></div>
<div style="background: #f1ebdb; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #43506b; display: flex; align-items: center">{{d.span}}</div>
</div>
<sc-if value="{{d.hasRows}}" hint-placeholder-val="{{true}}">
<div style="max-height: 520px; overflow: auto; border-top: 1px solid #e3dccb">
<sc-for list="{{d.rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid #e3dccb">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600">{{r.date}}</div>
<div style="font-size: 14px">{{r.route}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b6b6b">{{r.ac}}</div>
<div style="font-size: 12.5px; color: #43506b">{{r.src}} · <a class="efta" href="{{r.href}}" style="color: #0b3d91">{{r.efta}}</a></div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{d.note}}" hint-placeholder-val="{{false}}"><p style="margin: 0 0 12px; font-size: 14px; color: #2b2b2b">{{d.note}}</p></sc-if>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px">
<a href="book.html" onClick="{{d.openCard}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 9px; background: #0a1730; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 13.5px">Open their card</a>
<a href="{{chartHref}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #c3cde0; color: #0a1730; text-decoration: none; font-weight: 500; font-size: 13.5px">Full chart: EFTA02796838</a>
<a href="{{logHref}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #c3cde0; color: #0a1730; text-decoration: none; font-weight: 500; font-size: 13.5px">Pilot logbook: EFTA02846460</a>
</div>
</aside>
</div>

<div style="margin-top: 34px; background: #0a1c3d; border: 1px solid #1f3f74; border-radius: 14px; padding: 18px 20px">
<h3 style="margin: 0 0 6px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase">Not ticketed yet</h3>
<p style="margin: 0 0 10px; font-size: 14px; color: #c9d3e8">Rød-Larsen does not appear by name in either record; his travel shows up in later manifests and emails we have not transcribed yet. David Rodgers flew the planes and signed every logbook page, so he is not a passenger.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{missing}}" as="m" hint-placeholder-count="6"><span style="font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px dashed #3a5a92; color: #c9d3e8">{{m}}</span></sc-for>
</div>
</div>
</div>
</section>

<footer style="border-top: 1px solid #1f3f74; background: #010c26; padding: 30px 0 40px; font-size: 13px; color: #aab7d1">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 22px">Sources: v. Maxwell, No. 15-cv-07433 (S.D.N.Y.), Doc. 153-2, Composite Exhibit 2 (EFTA02796838); and the Rodgers pilot logbook, Government Exhibit 662-RR in U.S. v. Maxwell, released in the DOJ’s first phase of declassified Epstein files (EFTA02846460). Spellings and routes follow the records; some entries are hard to read.</div>
<div style="max-width: 1240px; margin: 8px auto 0; padding: 0 22px; margin-top: 14px"><div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><a href="mailto:localtip@proton.me" title="Email localtip@proton.me" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; background: #c8102e; color: #ffffff; font-weight: 700; font-size: 14px; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 2 10.5l7.5 3L12 21l3.5-6.2L22 2zM9.5 13.5 22 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Send a tip</a><a href="https://venmo.com/u/bustertoks" title="Venmo @bustertoks" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; background: #1f9d55; color: #ffffff; font-weight: 700; font-size: 14px; text-decoration: none"><span aria-hidden="true" style="display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; color: #1f9d55; font-size: 13px; font-weight: 800">$</span>Support us on Venmo <span style="font-weight: 500; opacity: .85">@bustertoks</span></a></div></div>

</footer>
</div>
</template>
